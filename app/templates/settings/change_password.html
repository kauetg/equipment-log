{% extends "base.html" %}
{% block title %}Trocar senha — Equipment Log{% endblock %}
{% block content %}
<div class="d-flex justify-content-center">
  <div class="account-page-card">
    <div class="text-center mb-3">
      <i class="bi bi-key change-password-icon"></i>
      <h1 class="h5 mb-0">Trocar senha</h1>
    </div>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Senha atual</label>
        <input type="password" name="current_password" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Nova senha</label>
        <input type="password" name="new_password" class="form-control" minlength="6" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirmar nova senha</label>
        <input type="password" name="confirm_password" class="form-control" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 mb-2">Salvar</button>
      <a href="{{ url_for('inventory.index') }}" class="btn btn-link w-100">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
