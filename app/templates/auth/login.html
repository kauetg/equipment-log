{% extends "base.html" %}
{% block title %}Login — Equipment Log{% endblock %}
{% block content %}
<div class="login-page-wrap">
  <div class="login-card">
    <img src="{{ url_for('static', filename='img/icon.svg') }}" alt="Equipment Log" class="login-logo">
    <h1 class="login-title">Equipment Log</h1>
    <p class="login-subtitle">Câmeras, caixas estanque, cartões e companhia</p>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" name="email" class="form-control" required autofocus>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">Senha</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
